[package]
name = "strate-factory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Factory: deploys a (PT, YT, AMM, Oracle, YS) quintuple per (underlying, maturity)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
strate-interfaces = { workspace = true }
# Factory imports the constructor arg structs from `strate-types` rather
# than from each child crate's rlib half. The earlier design pulled in
# pt-token / yt-token / amm / strate-oracle / yield-stripping directly,
# but that also pulled in their cdylib halves at wasm32 link time, which
# collided on the `__constructor` symbol export. `strate-types` is a
# pure-rlib types crate; depending on it gives us the wire format
# without the linker conflict.
strate-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
strate-testutils = { workspace = true, features = ["mock-blend"] }
# Tests reach into PT/YT client surfaces directly to verify the
# constructor-bind ordering. Pulling these in as dev-only deps keeps
# the production wasm build of strate-factory free of their cdylib
# halves (which is what caused the original __constructor symbol
# collision before the strate-types refactor).
pt-token = { path = "../pt-token" }
yt-token = { path = "../yt-token" }

[features]
# Enable include_bytes! of the five pre-built WASMs into the test
# harness. Off by default so `cargo check` works on a fresh clone; the
# Factory test suite requires this feature plus a prior wasm32 build.
test-wasm = []
