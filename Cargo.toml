[workspace]
resolver = "2"
members = [
    "contracts/yield-stripping",
    "contracts/amm",
    "contracts/oracle",
    "contracts/pt-token",
    "contracts/yt-token",
    "contracts/factory",
    "contracts/mock-blend",
    "contracts/blend-adapter",
    "packages/strate-interfaces",
    "packages/strate-math",
    "packages/strate-testutils",
    "packages/strate-types",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Strate Protocol"]
license = "BUSL-1.1"
repository = "https://github.com/strate-protocol/strate"

[workspace.dependencies]
# Core Soroban SDK (pinned to 22.x for stellar-contracts 0.4 compatibility).
soroban-sdk = "22.0.0"

# OpenZeppelin Stellar contracts were originally planned as base
# dependencies but the public 0.4 API surface was in flux and contracts
# now ship first-party SEP-41 + access logic (see contracts/pt-token/lib.rs).
# When we want to lean on OZ again the names landed on crates.io as
# stellar-access, stellar-tokens, stellar-contract-utils at 0.7+.

# Fixed-point base ops; we layer our own WAD helpers + exp/ln on top.
soroban-fixed-point-math = "1.3.0"

# Local workspace crates.
strate-interfaces = { path = "packages/strate-interfaces" }
strate-math = { path = "packages/strate-math" }
strate-testutils = { path = "packages/strate-testutils" }
strate-types = { path = "packages/strate-types" }

# Dev-deps.
proptest = "1.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Logs-enabled build (assertions on) for integration debugging.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
